name: Adaptive modulation policy tests
on:
  push:
    branches: [feature/adaptive-modulation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -p 'test_adaptive_*.py' -v

  stable-writer-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify and inspect pinned upstream Stable
        run: |
          curl -fsSL --retry 3 https://raw.githubusercontent.com/kamilostatek/hpi/93887c747d5c7171752032341319bd3eccebe1ab/1.4.5_stable.tar.gz -o /tmp/stable.tar.gz
          printf '%s  %s\n' ca803a3f8777efa75a40739d2efeb0362365ffa4291d3eb76d9a231c6cb53976 /tmp/stable.tar.gz | sha256sum -c -
          mkdir -p /tmp/stable-audit
          tar -xzf /tmp/stable.tar.gz -C /tmp/stable-audit
          python3 adaptive/audit_writers.py /tmp/stable-audit/main.py
          python3 - <<'PY'
          import ast
          from pathlib import Path
          s=Path('/tmp/stable-audit/main.py').read_text()
          t=ast.parse(s)
          names={'GetParameters','GetParametersNEW','ReadPump','set_newframe','new_tempchange','_tempzone_flimit_restore_guard','new_presetchange','new_flimitchange','log_status_snapshot','_pump_frame_fresh','change_mode_route','change_flimitrelay_route'}
          for n in t.body:
              if isinstance(n,ast.FunctionDef) and n.name in names:
                  print('FUNCTION',n.name)
                  for i,l in enumerate(s.splitlines()[n.lineno-1:n.end_lineno],n.lineno):
                      if n.name not in {'GetParameters','ReadPump'} or any(k in l.lower() for k in ('r201','mode','settemp','setpoint','r141','r241','frame','compinfo','antifreeze','service_set','threeway','defrost','getparameters','log_status_snapshot')):
                          print(f'{i}: {l}')
          PY
