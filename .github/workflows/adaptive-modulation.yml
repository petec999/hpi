name: Adaptive modulation policy tests
on:
  push:
    branches: [feature/adaptive-modulation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -p 'test_adaptive_*.py' -v

  stable-writer-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify and inspect pinned upstream Stable
        run: |
          curl -fsSL --retry 3 https://raw.githubusercontent.com/kamilostatek/hpi/93887c747d5c7171752032341319bd3eccebe1ab/1.4.5_stable.tar.gz -o /tmp/stable.tar.gz
          printf '%s  %s\n' ca803a3f8777efa75a40739d2efeb0362365ffa4291d3eb76d9a231c6cb53976 /tmp/stable.tar.gz | sha256sum -c -
          mkdir -p /tmp/stable-audit
          tar -xzf /tmp/stable.tar.gz -C /tmp/stable-audit
          python3 adaptive/audit_writers.py /tmp/stable-audit/main.py
