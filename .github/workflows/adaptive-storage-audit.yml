name: Adaptive storage audit
on:
  push:
    branches: [feature/adaptive-storage-audit]
  pull_request:
jobs:
  storage:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m py_compile adaptive/live_runtime.py tools/patch-adaptive-preview.py
      - run: python -m unittest discover -s tests -p test_adaptive_storage_audit.py -v
      - run: python -m unittest discover -s tests -p test_register_watch.py -v
