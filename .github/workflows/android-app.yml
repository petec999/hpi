name: Build HaierPi Android APK
on:
  push:
    branches: ['feature/android-app']
    paths: ['android-app/**', '.github/workflows/android-app.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Build and verify signed preview APK
        run: bash android-app/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HaierPi-Android-0.1.0
          path: |
            android-app/build/HaierPi-0.1.0-preview.apk
            android-app/build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
