name: Read-only Stable control audit
on:
  push:
    branches: [review/stable-auto-modulation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect pinned Stable heating control source
        run: |
          set -euo pipefail
          echo 'ca803a3f8777efa75a40739d2efeb0362365ffa4291d3eb76d9a231c6cb53976  1.4.5_stable.tar.gz' | sha256sum -c -
          tar -xOf 1.4.5_stable.tar.gz main.py > /tmp/control.py || tar -xOf 1.4.5_stable.tar.gz ./main.py > /tmp/control.py
          python3 - <<'PY'
          import ast,re
          s=open('/tmp/control.py').read()
          lines=s.splitlines()
          tree=ast.parse(s)
          terms=re.compile(r'\b(?:antionoff\w*|deltatemp\w*|presetautochange|presetquiet|presetturbo|flimit\w*|heatdemand|cooldemand|freqlimit|gpiocontrol|zone_frost\w*|zone_warm\w*|new_presetchange)\b',re.I)
          for n in tree.body:
              if not isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)): continue
              chunk=lines[n.lineno-1:n.end_lineno]
              hits=[i for i,l in enumerate(chunk) if terms.search(l)]
              if not hits: continue
              print('\n###',n.name,n.lineno,n.end_lineno,len(hits))
              if len(chunk)<=190 and n.name not in ('loadconfig','on_message'):
                  chosen=set(range(len(chunk)))
              else:
                  chosen={0}|{j for i in hits for j in range(max(0,i-7),min(len(chunk),i+10))}
              for i in sorted(chosen):
                  l=chunk[i]
                  if re.search(r'password|hpikey|token|secret|authorization',l,re.I): continue
                  print(f'{n.lineno+i}: {l}')
          PY
