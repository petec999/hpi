name: Web UI v2 preview tests
on:
  push:
    branches: [feature/web-ui-v2]
    paths:
      - 'tools/install-web-ui-v2.py'
      - 'install-web-ui-v2.sh'
      - 'tests/test_web_ui_v2.py'
      - '.github/workflows/web-ui-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9','3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'Flask>=2.2,<3.2' 'Flask-Login>=0.6,<0.7'
      - run: bash -n install-web-ui-v2.sh
      - run: python -m unittest discover -s tests -p test_web_ui_v2.py -v
      - name: Verify patch on pinned upstream archive plus watchdog v2
        run: |
          curl -fsSL --retry 3 https://raw.githubusercontent.com/kamilostatek/hpi/main/1.4.5_stable.tar.gz -o /tmp/stable.tar.gz
          printf '%s  %s\n' ca803a3f8777efa75a40739d2efeb0362365ffa4291d3eb76d9a231c6cb53976 /tmp/stable.tar.gz | sha256sum -c -
          python - <<'PY'
          import tarfile, runpy
          with tarfile.open('/tmp/stable.tar.gz') as t:
              m = [m for m in t.getmembers() if m.isfile() and m.name.removeprefix('./') == 'main.py']
              assert len(m) == 1
              core = t.extractfile(m[0]).read().decode()
          wd = runpy.run_path('tools/install-mqtt-watchdog.py')
          ui = runpy.run_path('tools/install-web-ui-v2.py')
          patched = wd['patch'](core)
          import ast
          names={n.name for n in ast.walk(ast.parse(patched)) if isinstance(n,ast.FunctionDef)}
          assert {'new_tempchange','statechange','new_presetchange','curvecalc','new_tempcompchange','validate_schedule','schedule_write','_load_schedule','_scheduler_config','saveconfig','loadconfig'} <= names
          result = ui['patch'](patched)
          assert result.replace(ui['BLOCK'],'',1)==patched, 'Unexpected modification outside UI block'
          assert '# HOME-IOT WEB V2 COUNTER TAP' not in result
          for old in (ui['PREVIOUS_BLOCK'],ui['CONTROL_BLOCK']):
              idx=result.index(ui['BLOCK'])
              previous=result[:idx]+old+result[idx+len(ui['BLOCK']):]
              assert ui['patch'](previous)==result
          for line in core.splitlines():
              if 'weekday()' in line or 'firstDay:' in line:
                  print('Weekday contract:',line.strip())
          print('Source contract verified')
          assert ui['patch'](result) == result
          compile(result, 'main.py', 'exec')
          print('Pinned stable + watchdog v2 + UI patch: syntax and idempotence OK')
          PY
      - name: Check embedded browser JavaScript syntax
        run: |
          python - <<'PY'
          import ast,runpy,pathlib
          block=runpy.run_path('tools/install-web-ui-v2.py')['BLOCK']
          tree=ast.parse(block)
          html=next(ast.literal_eval(n.value) for n in tree.body if isinstance(n,ast.Assign) and any(isinstance(k,ast.Name) and k.id=='_WV_HTML' for k in n.targets))
          pathlib.Path('/tmp/web-v2.html').write_text(html)
          pathlib.Path('/tmp/web-v2.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/web-v2.js
      - name: Execute browser UI against mocked live state and failed optional diagnostics
        run: |
          npm install --prefix /tmp/webui-test jsdom@24 --no-audit --no-fund
          node <<'JS'
          const {JSDOM,VirtualConsole}=require('/tmp/webui-test/node_modules/jsdom');
          const fs=require('fs');
          const errors=[];
          const vc=new VirtualConsole();
          vc.on('jsdomError',e=>errors.push(e.message));
          const d=new JSDOM(fs.readFileSync('/tmp/web-v2.html','utf8'),{
            url:'http://localhost/v2/',runScripts:'dangerously',virtualConsole:vc,
            beforeParse(w){
              w.scrollTo=()=>{};
              w.fetch=async url=>{
                if(url.includes('diagnostics')) throw Error('simulated failure');
                return {ok:true,redirected:false,json:async()=>({
                  schema:1,frames:{r141:{fresh:true,age_s:2},r241:{fresh:true,age_s:3}},
                  values:{two:32,twi:28,fact:40,pd:22,ps:7,defrost:false},
                  controls:{settemp:30,dhw:50,hcurve:32,mode:'eco',pch:'on',pdhw:'off'},
                  control_ready:true,mqtt:true,watchdog:{status:'ok',age_s:1,failures:0,recoveries:0}
                })};
              };
            }
          });
          setTimeout(()=>{
            const doc=d.window.document;
            const assert=require('assert/strict');
            try{
              assert.equal(doc.querySelector('[data-value="two"]').textContent,'32');
              assert.equal(doc.getElementById('transport').textContent,'WWW · OK');
              assert.equal(doc.getElementById('r141').textContent,'R141 · OK');
              assert.equal(doc.getElementById('r241').textContent,'R241 · OK');
              assert.equal(doc.getElementById('notice').classList.contains('hide'),true);
              assert.deepEqual(errors,[]);
              console.log('Live telemetry survives independent diagnostics failure');
            } finally {d.window.close();}
          },300);
          JS
